name: CI

on:
  # Every branch, not just main: trunk has lived on a feature branch before, and a
  # main-only trigger meant CI silently never ran (which let lint/format breakage land).
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew ktlintCheck detekt test :modules:database:verifyMainScpDatabaseMigration
