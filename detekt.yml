# Project detekt config, layered on top of the default ruleset (buildUponDefaultConfig = true).
style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4

complexity:
  LongParameterList:
    functionThreshold: 8
    # Use-cases receive all ports via constructor injection (manual DI, ADR-12); a
    # write-path use-case legitimately touches 6 repositories + infra ports.
    constructorThreshold: 14
  LongMethod:
    # The composition roots (CliComponents.build, AppComponents.build) wire ~15 use-cases
    # by hand; ADR-12 keeps that as one plain, readable function rather than splitting it
    # behind helper indirection.
    threshold: 100
  CyclomaticComplexMethod:
    threshold: 18

naming:
  FunctionNaming:
    ignoreAnnotated: ['Test']
